<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpeechLab | Session in use</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #18212b;
            --muted: #65717d;
            --panel: #ffffff;
            --line: #d7dee5;
            --accent: #2367d1;
            --accent-dark: #174a9b;
            --background: #eef2f5;
        }
        * { box-sizing: border-box; }
        html, body { min-height: 100%; margin: 0; }
        body {
            display: grid;
            place-items: center;
            padding: 24px;
            background: linear-gradient(135deg, #e8edf2, var(--background));
            color: var(--ink);
            font-family: "Segoe UI", system-ui, sans-serif;
        }
        main {
            width: min(100%, 560px);
            padding: clamp(28px, 6vw, 54px);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: 0 20px 55px rgba(24, 33, 43, 0.14);
            text-align: center;
        }
        .status-mark {
            display: grid;
            place-items: center;
            width: 68px;
            height: 68px;
            margin: 0 auto 22px;
            border-radius: 50%;
            background: #e6efff;
            color: var(--accent);
            font-size: 30px;
            font-weight: 700;
        }
        h1 { margin: 0 0 12px; font-size: clamp(24px, 5vw, 34px); letter-spacing: -0.4px; }
        p { margin: 0 auto; max-width: 420px; color: var(--muted); line-height: 1.6; }
        .note {
            margin: 24px 0;
            padding: 14px 16px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #f7f9fb;
            color: var(--muted);
            font-size: 14px;
        }
        button {
            min-height: 44px;
            padding: 0 22px;
            border: 0;
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
        button:hover { background: var(--accent-dark); }
        small { display: block; margin-top: 18px; color: var(--muted); }
    </style>
</head>
<body>
    <main>
        <div class="status-mark" aria-hidden="true">1</div>
        <h1>Classroom already in use</h1>
        <p>Another teacher device is currently controlling this SpeechLab classroom.</p>
        <div class="note">Only one teacher dashboard can be active at a time. Your ESP32 classroom devices remain connected.</div>
        <button type="button" onclick="window.location.replace('/')">Try again</button>
        <small>Close the active teacher dashboard before connecting from this device.</small>
    </main>
</body>
</html>
